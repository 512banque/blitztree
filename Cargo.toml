[package]
name = "blitztree"
version = "0.5.6"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "blitztree"
path = "src/bin/blitztree/main.rs"
required-features = ["cli"]

[features]
cli = []

[dependencies]
libc = "0.2"
rayon = "1.10"
serde_json = { version = "1.0", features = ["arbitrary_precision"] }

[profile.release]
lto = "thin"
codegen-units = 1
